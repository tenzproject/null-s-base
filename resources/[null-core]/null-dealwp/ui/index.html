<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>DealWP</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="colors.css" />
        <link rel="stylesheet" href="frame.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <div id="phone-wrapper">
            <div class="app" id="content">
                <div class="app-wrapper">
                    <div class="header">
                        <div class="title">DealWP</div>
                        <div class="subtitle">Vente Discrète</div>
                    </div>
                    <div class="content-wrapper">
                        <div class="drug-list">
                            <h3>Produits disponibles</h3>
                            <div class="drug-item">
                                <input type="checkbox" id="weed" class="drug-checkbox" data-id="weed" data-label="Pochon de Weed" data-item="weed_pooch">
                                <label for="weed">P0ch0n de W&&d</label>
                                <span class="drug-status" id="weed-status"></span>
                            </div>
                            <div class="drug-item">
                                <input type="checkbox" id="meth" class="drug-checkbox" data-id="meth" data-label="Pochon de Meth" data-item="meth_pooch">
                                <label for="meth">P0ch0n de M&th</label>
                                <span class="drug-status" id="meth-status"></span>
                            </div>
                            <div class="drug-item">
                                <input type="checkbox" id="coke" class="drug-checkbox" data-id="coke" data-label="Pochon de Coke" data-item="coke_pooch">
                                <label for="coke">P0ch0n de C0ke</label>
                                <span class="drug-status" id="coke-status"></span>
                            </div>
                            <div class="button-group">
                                <button id="start-dealing" class="action-button"><i class="fas fa-search"></i> Rechercher des acheteurs</button>
                                <button id="stop-dealing" class="action-button stop-button" style="display: none;"><i class="fas fa-times"></i> Annuler la recherche</button>
                            </div>
                        </div>
                        <div class="deal-offers" id="deal-offers">
                            <!-- Les offres des acheteurs apparaîtront ici -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="dev.js"></script>
        <script>
            let scriptLoaded = false;
            let pendingMessages = [];

            function processMessage(data) {
                if (data?.type === 'updateDrugStatus') {
                    updateDrugStatus(data.drugId, data.hasItem);
                } else if (data?.type === 'newDealOffer') {
                    showDealOffer(data.offer);
                } else if (data?.type === 'updateOffer') {
                    updateOffer(data.offerId, data.newPrice, data.message);
                } else if (data?.type === 'dealingStopped') {
                    document.getElementById('start-dealing').style.display = 'block';
                    document.getElementById('stop-dealing').style.display = 'none';
                    document.getElementById('deal-offers').innerHTML = '';
                }
            }

            window.addEventListener('message', (e) => {
                if (e.data === 'componentsLoaded') {
                    const script = document.createElement('script');
                    script.src = 'script.js';
                    script.onload = function() {
                        scriptLoaded = true;
                        // Process any messages that arrived before script.js loaded
                        pendingMessages.forEach(msg => processMessage(msg));
                        pendingMessages = [];

                        // Vérifier l'état de recherche à l'ouverture de l'application
                        fetchNui('checkDealingStatus').then((response) => {
                            if (response && response.isLookingForBuyers) {
                                document.getElementById('start-dealing').style.display = 'none';
                                document.getElementById('stop-dealing').style.display = 'block';
                                
                                fetchNui('getActiveOffers').then((offersResponse) => {
                                    if (offersResponse && offersResponse.offers && offersResponse.offers.length > 0) {
                                        document.getElementById('deal-offers').innerHTML = '';
                                        offersResponse.offers.forEach(offer => {
                                            showDealOffer(offer);
                                        });
                                    }
                                });
                            } else {
                                document.getElementById('start-dealing').style.display = 'block';
                                document.getElementById('stop-dealing').style.display = 'none';
                            }
                        });
                    };
                    document.body.appendChild(script);
                } else if (scriptLoaded) {
                    processMessage(e.data);
                } else {
                    // Queue messages until script.js is loaded
                    pendingMessages.push(e.data);
                }
            });
        </script>
    </body>
</html>
